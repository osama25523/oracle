name: Build Oracle of Runes Direct Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3 \
            pkg-config \
            zip \
            unzip \
            cmake \
            ninja-build

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;23.2.8568313"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> "$GITHUB_ENV"

      - name: Clone ScummVM
        run: |
          git clone --depth 1 https://github.com/scummvm/scummvm.git scummvm-src

      - name: Patch Android direct boot
        run: |
          python3 patch_scummvm.py scummvm-src

      - name: Clone Oboe
        run: |
          git clone --depth 1 https://github.com/google/oboe.git oboe

      - name: Build Oboe
        shell: bash
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/23.2.8568313"

          cmake \
            -S oboe \
            -B oboe-build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DOBOE_BUILD_TESTS=OFF \
            -DOBOE_BUILD_SAMPLES=OFF

          cmake --build oboe-build -j2

          OBOE_LIB="$(find oboe-build -name "liboboe.a" | head -n 1)"
          OBOE_LIB_DIR="$(dirname "$OBOE_LIB")"

          echo "OBOE_LIB_DIR=$GITHUB_WORKSPACE/$OBOE_LIB_DIR" >> "$GITHUB_ENV"
          echo "OBOE_INCLUDE_DIR=$GITHUB_WORKSPACE/oboe/include" >> "$GITHUB_ENV"

      - name: Configure ScummVM
        working-directory: scummvm-src
        shell: bash
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/23.2.8568313"
          export CFLAGS="-I$OBOE_INCLUDE_DIR"
          export CXXFLAGS="-I$OBOE_INCLUDE_DIR"
          export LDFLAGS="-L$OBOE_LIB_DIR"

          ./configure \
            --host=android-arm64-v8a \
            --disable-all-engines \
            --enable-engine=director \
            --disable-debug

      - name: Build native ScummVM
        working-directory: scummvm-src
        shell: bash
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/23.2.8568313"
          export CFLAGS="-I$OBOE_INCLUDE_DIR"
          export CXXFLAGS="-I$OBOE_INCLUDE_DIR"
          export LDFLAGS="-L$OBOE_LIB_DIR"

          make -j2

          test -d android_project
          test -d android_project/mainAssets

      - name: Bundle Oracle of Runes into APK assets
        shell: bash
        run: |
          ASSET_DIR="scummvm-src/android_project/mainAssets/src/main/assets/oracle-runes-game"

          mkdir -p "$ASSET_DIR"

          cp game_data/runes7.dxr "$ASSET_DIR/"
          cp game_data/Runes.dat "$ASSET_DIR/"
          cp game_data/Runes.skr "$ASSET_DIR/"

          ls -lah "$ASSET_DIR"

      - name: Build APK
        working-directory: scummvm-src/android_project
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          APK_PATH="$(
            find scummvm-src/android_project \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_PATH" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p output
          cp "$APK_PATH" output/Oracle-of-Runes-DIRECT.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-of-Runes-DIRECT
          path: output/Oracle-of-Runes-DIRECT.apk
          if-no-files-found: error
          retention-days: 7
