name: Build Oracle of Runes Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build packages and Android components
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3 \
            pkg-config \
            zip \
            unzip \
            cmake \
            ninja-build

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;23.2.8568313"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Clone ScummVM
        shell: bash
        run: |
          git clone --depth 1 https://github.com/scummvm/scummvm.git scummvm-src

      - name: Add Oracle of Runes Director detection
        shell: bash
        run: |
          python3 patch_scummvm.py scummvm-src

      - name: Verify Oracle of Runes source patch
        shell: bash
        run: |
          echo "Checking Oracle of Runes patch..."

          grep -n "Oracle of Runes" \
            scummvm-src/engines/director/detection_tables.h

          grep -n "ORACLE_OF_RUNES_DETECTION" \
            scummvm-src/engines/director/detection_tables.h

          grep -n "runes7.dxr" \
            scummvm-src/engines/director/detection_tables.h

          echo "Verification completed."

      - name: Clone Oboe
        shell: bash
        run: |
          git clone --depth 1 https://github.com/google/oboe.git oboe

      - name: Build Oboe for Android arm64
        shell: bash
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/23.2.8568313"

          cmake \
            -S oboe \
            -B oboe-build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DOBOE_BUILD_TESTS=OFF \
            -DOBOE_BUILD_SAMPLES=OFF

          cmake --build oboe-build -j2

          OBOE_LIB="$(find oboe-build -name "liboboe.a" | head -n 1)"

          if [ -z "$OBOE_LIB" ]; then
            echo "ERROR: liboboe.a was not generated"
            exit 1
          fi

          OBOE_LIB_DIR="$(dirname "$OBOE_LIB")"

          echo "OBOE_LIB=$GITHUB_WORKSPACE/$OBOE_LIB" >> "$GITHUB_ENV"
          echo "OBOE_LIB_DIR=$GITHUB_WORKSPACE/$OBOE_LIB_DIR" >> "$GITHUB_ENV"
          echo "OBOE_INCLUDE_DIR=$GITHUB_WORKSPACE/oboe/include" >> "$GITHUB_ENV"

      - name: Configure ScummVM for Android arm64 with Director only
        working-directory: scummvm-src
        shell: bash
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/23.2.8568313"

          export CFLAGS="-I$OBOE_INCLUDE_DIR"
          export CXXFLAGS="-I$OBOE_INCLUDE_DIR"
          export LDFLAGS="-L$OBOE_LIB_DIR"

          ./configure \
            --host=android-arm64-v8a \
            --disable-all-engines \
            --enable-engine=director \
            --disable-debug

      - name: Build native ScummVM and generate Android project
        working-directory: scummvm-src
        shell: bash
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/23.2.8568313"

          export CFLAGS="-I$OBOE_INCLUDE_DIR"
          export CXXFLAGS="-I$OBOE_INCLUDE_DIR"
          export LDFLAGS="-L$OBOE_LIB_DIR"

          make -j2

          echo "Checking Android project..."
          test -d android_project
          test -f android_project/src.properties
          test -d android_project/mainAssets

      - name: Bundle Oracle of Runes game files
        shell: bash
        run: |
          mkdir -p scummvm-src/android_project/oracle-runes-game

          cp game_data/* \
            scummvm-src/android_project/oracle-runes-game/

          mkdir -p \
            scummvm-src/android_project/mainAssets/src/main/assets/oracle-runes-game

          cp game_data/* \
            scummvm-src/android_project/mainAssets/src/main/assets/oracle-runes-game/

          echo "Bundled files:"
          ls -lah scummvm-src/android_project/oracle-runes-game

      - name: Build APK
        working-directory: scummvm-src/android_project
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            assembleDebug

      - name: Find generated APK
        shell: bash
        run: |
          echo "Searching for generated APK..."

          find scummvm-src/android_project \
            -type f \
            -name "*.apk" \
            -print

          APK_PATH="$(
            find scummvm-src/android_project \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK generated"
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Collect output
        shell: bash
        run: |
          mkdir -p output

          test -f "$APK_PATH"

          cp "$APK_PATH" \
            output/Oracle-of-Runes-debug.apk

          cp -r game_data \
            output/oracle-runes-game

          cd output

          zip -r \
            Oracle-of-Runes-Android-Package.zip \
            Oracle-of-Runes-debug.apk \
            oracle-runes-game

          ls -lah

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-of-Runes-Android-FIXED
          path: output/Oracle-of-Runes-Android-Package.zip
          if-no-files-found: error
          retention-days: 7
