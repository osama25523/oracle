name: Build Oracle of Runes Direct Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'patch_scummvm.py'
      - 'patch_diagnostics.py'
      - 'patch_primary_handler.py'
      - 'patch_puzzle_queue_always.py'
      - 'patch_mouse_position.py'
      - '.github/workflows/build-apk.yml'
      - 'game_data/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Inspect Oracle Director movie strings
        shell: bash
        run: |
          echo '===== ORACLE DIRECTOR SCRIPT STRINGS ====='
          strings -a -n 4 game_data/runes7.dxr | grep -Eai 'mouse(up|down)|puzzle|behavior|click|go to|go frame|frame|script|member|new|letter|run(e|es)' | head -n 600 || true
          echo '===== END ORACLE DIRECTOR SCRIPT STRINGS ====='

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build packages and Android SDK
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 pkg-config zip unzip cmake ninja-build

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;23.2.8568313"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> "$GITHUB_ENV"
          test -d "$ANDROID_SDK_ROOT/ndk/23.2.8568313"

      - name: Clone ScummVM
        run: git clone --depth 1 https://github.com/scummvm/scummvm.git scummvm-src

      - name: Patch Oracle of Runes
        shell: bash
        run: |
          python3 -m py_compile patch_scummvm.py patch_diagnostics.py patch_primary_handler.py patch_puzzle_queue_always.py patch_mouse_position.py
          python3 patch_scummvm.py scummvm-src
          python3 patch_diagnostics.py scummvm-src
          python3 patch_primary_handler.py scummvm-src
          python3 patch_puzzle_queue_always.py scummvm-src
          python3 patch_mouse_position.py scummvm-src

      - name: Verify Oracle patch
        shell: bash
        run: |
          grep -n '"xtra", LB::b_orunesXtra' scummvm-src/engines/director/lingo/lingo-builtins.cpp
          grep -n '"xtnd", LB::b_orunesXtnd' scummvm-src/engines/director/lingo/lingo-builtins.cpp
          grep -n 'void LB::b_orunesXtra' scummvm-src/engines/director/lingo/lingo-builtins.cpp
          grep -n 'void LB::b_orunesXtnd' scummvm-src/engines/director/lingo/lingo-builtins.cpp
          grep -n 'ORACLE_RUNES_DIRECT_BOOT_PATCH' scummvm-src/backends/platform/android/org/scummvm/scummvm/ScummVMActivity.java
          grep -n 'ORACLE_RUNES_CLICK_DIAGNOSTIC' scummvm-src/engines/director/events.cpp
          grep -n 'ORACLE_RUNES_PRIMARY_HANDLER_NAME_FIX' scummvm-src/engines/director/lingo/lingo-events.cpp
          grep -n 'SPUZZ()' scummvm-src/engines/director/lingo/lingo-events.cpp
          grep -n 'ORACLE_RUNES_ALWAYS_QUEUE_PUZZLE_GOTO' scummvm-src/engines/director/lingo/lingo-funcs.cpp
          grep -n 'ORACLE_RUNES_TOUCH_MOUSE_POSITION_FIX' scummvm-src/engines/director/lingo/lingo-the.cpp
          grep -n '_lastMousePos.x' scummvm-src/engines/director/lingo/lingo-the.cpp
          grep -n '_lastMousePos.y' scummvm-src/engines/director/lingo/lingo-the.cpp
          echo "PATCH VERIFIED"

      - name: Clone Oboe
        run: git clone --depth 1 https://github.com/google/oboe.git oboe

      - name: Build Oboe
        shell: bash
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/23.2.8568313"
          cmake -S oboe -B oboe-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DOBOE_BUILD_TESTS=OFF \
            -DOBOE_BUILD_SAMPLES=OFF
          cmake --build oboe-build -j2
          OBOE_LIB="$(find oboe-build -name 'liboboe.a' | head -n 1)"
          test -n "$OBOE_LIB"
          OBOE_LIB_DIR="$(dirname "$OBOE_LIB")"
          echo "OBOE_LIB_DIR=$GITHUB_WORKSPACE/$OBOE_LIB_DIR" >> "$GITHUB_ENV"
          echo "OBOE_INCLUDE_DIR=$GITHUB_WORKSPACE/oboe/include" >> "$GITHUB_ENV"

      - name: Configure ScummVM
        working-directory: scummvm-src
        shell: bash
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/23.2.8568313"
          export CFLAGS="-I$OBOE_INCLUDE_DIR"
          export CXXFLAGS="-I$OBOE_INCLUDE_DIR"
          export LDFLAGS="-L$OBOE_LIB_DIR"
          ./configure \
            --host=android-arm64-v8a \
            --disable-all-engines \
            --enable-engine=director \
            --disable-debug

      - name: Build native ScummVM
        working-directory: scummvm-src
        shell: bash
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/23.2.8568313"
          export CFLAGS="-I$OBOE_INCLUDE_DIR"
          export CXXFLAGS="-I$OBOE_INCLUDE_DIR"
          export LDFLAGS="-L$OBOE_LIB_DIR"
          make -j2
          test -d android_project
          test -d android_project/mainAssets

      - name: Bundle Oracle of Runes files
        shell: bash
        run: |
          ASSET_DIR="scummvm-src/android_project/mainAssets/src/main/assets/oracle-runes-game"
          mkdir -p "$ASSET_DIR"
          cp game_data/runes7.dxr "$ASSET_DIR/"
          cp game_data/Runes.dat "$ASSET_DIR/"
          cp game_data/Runes.skr "$ASSET_DIR/"
          ls -lah "$ASSET_DIR"

      - name: Build APK
        working-directory: scummvm-src/android_project
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          APK_PATH="$(find scummvm-src/android_project -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          test -f "$APK_PATH"
          mkdir -p output
          cp "$APK_PATH" output/Oracle-of-Runes-touch-mouse-fix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-of-Runes-TOUCH-MOUSE-FIX
          path: output/Oracle-of-Runes-touch-mouse-fix.apk
          if-no-files-found: error
          retention-days: 7
