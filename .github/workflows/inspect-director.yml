name: Inspect Oracle Director Movie

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-director.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git pkg-config libsdl2-dev libpng-dev zlib1g-dev libjpeg-dev libfreetype6-dev xvfb

      - name: Build host ScummVM Director only
        run: |
          git clone --depth 1 https://github.com/scummvm/scummvm.git scummvm-host
          cd scummvm-host
          ./configure --disable-all-engines --enable-engine=director --disable-debug
          make -j2

      - name: Dump Oracle Lingo scripts
        shell: bash
        run: |
          mkdir -p dumps
          cat > scummvm.ini <<EOF
          [scummvm]
          dump_scripts=true
          confirm_exit=false

          [orunes]
          engineid=director
          gameid=director
          path=$GITHUB_WORKSPACE/game_data
          platform=windows
          version=702
          start_movie=runes7.dxr
          EOF
          timeout 25s xvfb-run -a ./scummvm-host/scummvm --config="$GITHUB_WORKSPACE/scummvm.ini" --dump-scripts orunes || true
          echo '===== SPUZZ REFERENCES ====='
          grep -RniE 'spuzz|SPUZZ' dumps --include='*.lingo' -C 50 || true
          echo '===== SELECT SCREEN CORE SCRIPTS ====='
          for f in $(find dumps -type f \( -name '*BehaviorScript-69.lingo' -o -name '*BehaviorScript-77.lingo' -o -name '*MovieScript-74.lingo' \)); do
            echo "===== $f ====="
            cat "$f"
          done
          echo '===== ALL HANDLERS CONTAINING PUZZ ====='
          grep -RniE '^on |PUZZ|mouseDownScript|mouseUpScript' dumps --include='*.lingo' -C 8 | head -n 5000 || true
          tar -czf oracle-lingo-dumps.tar.gz $(find dumps -type f -name '*.lingo') || true

      - name: Upload script dumps
        uses: actions/upload-artifact@v4
        with:
          name: oracle-lingo-dumps
          path: oracle-lingo-dumps.tar.gz
          if-no-files-found: warn
          retention-days: 7
